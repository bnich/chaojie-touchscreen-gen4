name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openscad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # These are not optional extras. The mesh and volume checks are what catch
      # a hollow part — the spline teeth once shipped at 44 mm^3 against the
      # ~915 they needed, while passing watertight, zero boundary edges, zero
      # non-manifold edges and one connected component. All four are surface
      # topology; none of them test fill.
      #   rtree is NOT optional either: it backs trimesh's ray engine, which is
      # what tools/check_shade.py uses to measure whether the sun visor
      # actually shades the screen. Without it that check dies with
      # ModuleNotFoundError partway through the run. Verified by building a
      # venv with exactly this list minus rtree and watching it fail.
      - name: Install mesh tooling
        run: pip install trimesh manifold3d numpy scipy networkx rtree

      - name: Export every part, verify meshes, volumes and clearances
        run: xvfb-run -a ./tools/build.sh

      # Prove the design assertions are live rather than decorative: break one
      # on purpose and require the failure. Checked via a SOLID export, because
      # a failed assert() exits 0 for tree formats and for PNG.
      - name: Prove the assertions actually fire
        run: |
          set +e
          out=$(xvfb-run -a openscad -o /dev/null --export-format=asciistl \
                -D 'm5_len=16' src/gen4-display-mount.scad 2>&1)
          echo "$out" | grep -q "BOLT BOTTOMS OUT" \
            || { echo "assertion did not fire — the guards are not working"; exit 1; }
          echo "assertion guards confirmed live"
